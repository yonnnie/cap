<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mint–Coral Jelly Flow</title>
<style>
  html,body{margin:0;height:100%;background:#03070a;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:16px;bottom:14px;color:#9fe9d6aa;font-size:12px;letter-spacing:.04em;user-select:none}
  #ui b{color:#ff9a86cc;font-weight:500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">부딪히면 색이 깨어나요 · 클릭: 해파리 추가 · 드래그: 흐름 휘젓기 · <b>Space</b>: 일시정지 · <b>T</b>: 잔상 on/off</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(1.5, window.devicePixelRatio || 1);
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#03070a'; ctx.fillRect(0,0,W,H); }
addEventListener('resize', resize); resize();

// ---------- palette: 겉 = 투명 민트, 속 = 코랄 ----------
const MINT_A = [127,255,212], MINT_B = [150,240,230];   // 민트 ↔ 아쿠아민트
const CORAL_A = [255,110,85], CORAL_B = [255,140,105]; // 코랄 ↔ 피치코랄
const mix = (a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgba = (c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------- flow field (smooth pseudo-noise) ----------
function flow(x,y,t){
  const s=0.0018;
  const a = Math.sin(x*s*1.3 + t*0.11) + Math.cos(y*s*1.7 - t*0.07)
          + Math.sin((x+y)*s*0.8 + t*0.05) * 0.8;
  return a * Math.PI;
}
let stir = null; // mouse stirring

// ---------- jelly ----------
let rnd = Math.random;
class Jelly{
  constructor(x,y,R){
    this.x=x; this.y=y; this.R=R||(40+rnd()*70);
    this.arms = 7 + Math.floor(rnd()*8);
    this.rot = rnd()*Math.PI*2;
    this.spin = (rnd()-.5)*0.004;
    this.phase = rnd()*Math.PI*2;
    this.freq = 0.55 + rnd()*0.35; this.cyc=rnd(); this.k=0; this.rest=0; this.heading=rnd()*Math.PI*2; this.twist=(rnd()-.5)*0.05;
    this.hist=[]; this.histTick=0; this.echo=0; this.echoTimer=rnd()*200;
    this.reveal=0; this.target=0; this.flash=0; this.touch=new Set();
    this.vx=0; this.vy=0; this.wander=(rnd()-.5)*2.4;
    this.hueT = rnd();               // 개체별 색 위상
    this.rays = [];
    const n = Math.floor(160 + this.R*2.6);
    for(let i=0;i<n;i++) this.rays.push({a:rnd()*Math.PI*2, l:0.55+Math.pow(rnd(),0.35)*0.5, b:(rnd()-.5)});
    this.tips=[]; for(let k=0;k<this.arms;k++) this.tips.push(rnd()*0.15);
    this.specks=[]; for(let i=0;i<Math.floor(this.R*1.2);i++) this.specks.push({a:rnd()*Math.PI*2, f:0.25+Math.sqrt(rnd())*0.7});
  }
  radius(th,k){
    // 촉수 로브 형태: |cos|^p 로 둥근 팔, 사이 골은 얕게
    const n=this.arms, c=Math.abs(Math.cos(th*n/2));
    const lobe = Math.pow(c, 0.9);
    return this.R*(0.52 + 0.48*lobe*(1-0.4*k))*(1-0.07*k);   // 수축 시 팔이 안쪽으로 접힘
  }
  hit(){ this.target=Math.min(1,this.target+0.45); this.flash=1; }
  update(t,dt){
    const ang = flow(this.x,this.y,t) + this.wander + Math.sin(t*0.3+this.phase)*0.8;
    for(const o of jellies){ if(o===this) continue; const dx=this.x-o.x, dy=this.y-o.y, d=Math.hypot(dx,dy)+1, m=(this.R+o.R)*0.9;
      if(d<m){ const f=(m-d)/m*0.04; this.vx+=dx/d*f; this.vy+=dy/d*f;
        // 부딪힘 '진입' 순간에만 반응
        if(!this.touch.has(o)){ this.touch.add(o); o.touch.add(this);
          this.hit(); o.hit();
          ripples.push({x:(this.x+o.x)/2, y:(this.y+o.y)/2, r:4, life:1, max:(this.R+o.R)*0.8});
        }
      } else if(d>m*1.15 && this.touch.has(o)){ this.touch.delete(o); o.touch.delete(this); }
    }
    // 드러남 정도가 목표값을 부드럽게 따라가고, 목표는 아주 천천히 다시 투명으로
    this.reveal += (this.target - this.reveal)*0.025*dt;
    this.target = Math.max(0, this.target - 0.0006*dt);
    this.flash = Math.max(0, this.flash - 0.03*dt);
    // --- 맥동 사이클: 빠른 수축(28%) → 느린 이완(72%), 가끔 쉬기 ---
    if(this.rest>0){ this.rest -= dt*0.016; }
    else {
      this.cyc += dt*0.016*this.freq;
      if(this.cyc>=1){ this.cyc-=1;
        this.freq = Math.min(1.0, Math.max(0.45, this.freq+(rnd()-.5)*0.12));
        if(rnd()<0.18) this.rest = 0.4+rnd()*1.6;          // 한 박자 쉬며 떠다님
        this.twist = (rnd()-.5)*0.05;
      }
    }
    const c=this.cyc, CT=0.28;
    const k = c<CT ? 0.5-0.5*Math.cos(Math.PI*c/CT)            // 수축: 부드럽지만 빠르게
                   : Math.pow(1-(c-CT)/(1-CT), 2.2);            // 이완: 처음엔 빨리, 끝은 천천히
    const dk = Math.max(0, k-this.k); this.k = k;
    const pulse = k;
    // 진행 방향은 흐름 쪽으로 천천히 선회
    let dh = ang - this.heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    this.heading += dh*0.006*dt;
    // 수축하는 순간에만 앞으로 '퐁' 하고 밀려남 + 흐름에 약하게 실려감
    const push = dk*2.4;
    this.vx += Math.cos(this.heading)*push + Math.cos(ang)*0.004*dt;
    this.vy += Math.sin(this.heading)*push + Math.sin(ang)*0.004*dt - 0.0015*dt;
    this.rot += dk*this.twist*6;                                  // 박동마다 살짝 비틀림
    if(stir){
      const dx=this.x-stir.x, dy=this.y-stir.y, d2=dx*dx+dy*dy+400;
      const f = 900/d2;
      this.vx += stir.vx*f*0.05 + (-dy)*f*0.002;
      this.vy += stir.vy*f*0.05 + ( dx)*f*0.002;
    }
    const drag=Math.pow(0.968,dt); this.vx*=drag; this.vy*=drag;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.rot += this.spin*dt*0.4;
    const m=this.R*1.4;
    if(this.x<-m) this.x=W+m; if(this.x>W+m) this.x=-m;
    if(this.y<-m) this.y=H+m; if(this.y>H+m) this.y=-m;
    // 움직임(속도)이 색을 밀어낸다 → 빠를수록 코랄이 바깥으로 번짐
    const sp = Math.hypot(this.vx,this.vy);
    this.heat += ((Math.min(1,sp*0.9)) - this.heat)*0.03;
    this.hueT += 0.0012*dt + sp*0.002;
    this.pulse = pulse;
    // 지나온 자리 기록
    if((this.histTick+=dt)>=3){ this.histTick=0; this.hist.unshift({x:this.x,y:this.y,rot:this.rot,p:pulse}); if(this.hist.length>36) this.hist.pop(); }
    // 잔상 버스트: 랜덤한 순간에 켜졌다 꺼짐 (부딪히면 더 잘 켜짐)
    this.echoTimer -= dt;
    if(this.echoTimer<=0){
      if(this.echo>0){ this.echo=0; this.echoTimer=200+rnd()*500; }
      else { this.echo=1; this.echoTimer=15+rnd()*40; }
    }
    if(this.flash>0.9 && rnd()<0.2){ this.echo=1; this.echoTimer=40+rnd()*40; }
  }
  drawEchoes(){
    if(!this.echo || this.hist.length<8) return;
    const v=this.reveal, h=(Math.sin(this.hueT*Math.PI*2)+1)/2;
    const mint=mix([200,225,225], mix(MINT_A,MINT_B,h), Math.min(1,v*1.6));
    const coral=mix(mint, mix(CORAL_A,CORAL_B,1-h), v);
    for(let n=1;n<=3;n++){
      const e=this.hist[Math.min(this.hist.length-1, n*6)];
      if(rnd()<0.2) continue;                       // 깜빡임: 프레임마다 랜덤하게 빠짐
      const a = (0.28 - n*0.06) * (0.6+rnd()*0.4) * (0.35+0.65*v);
      if(a<=0) continue;
      ctx.beginPath();
      for(let i=0;i<=90;i++){
        const ang=i/90*Math.PI*2, th=ang+e.rot, L=this.radius(ang,e.p);
        const px=e.x+Math.cos(th)*L, py=e.y+Math.sin(th)*L;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.strokeStyle=rgba(mint,a*0.5); ctx.lineWidth=0.7; ctx.stroke();
      ctx.fillStyle=rgba(mint,a*0.04); ctx.fill();
      ctx.fillStyle=rgba(coral,a*0.6);
      ctx.beginPath(); ctx.arc(e.x,e.y,this.R*0.06,0,7); ctx.fill();
    }
  }
  draw(t){
    const {x,y,R}=this, p=this.pulse;
    const h = (Math.sin(this.hueT*Math.PI*2)+1)/2;
    const v = this.reveal;                      // 0 = 거의 보이지 않는 유리, 1 = 민트/코랄
    const GHOST=[200,225,225];
    const mint  = mix(GHOST, mix(MINT_A,MINT_B,h), Math.min(1,v*1.6));
    const coral = mix(mint,  mix(CORAL_A,CORAL_B,1-h), v);   // 코랄은 충분히 부딪혀야 올라옴
    ctx.globalAlpha = Math.min(1, 0.22 + 0.78*v + this.flash*0.35);
    const coreStop = 0.14 + this.heat*0.28 + (p+1)*0.03;
    const Rmax = R*1.15;
    const sway = Math.sin(this.cyc*Math.PI*2 - 1.3)*0.07*(0.4+p);   // 팔끝이 몸통보다 한 박자 늦게 따라옴
    const P = (a,f)=>{ const th=a+this.rot, L=this.radius(a,p)*f, b=sway*(L/R)*(L/R); return [x+Math.cos(th+b)*L, y+Math.sin(th+b)*L]; };

    // 1) 유리 같은 몸통: 속은 거의 비고 가장자리로 갈수록 빛이 맺힘 (림 라이트)
    const outline = new Path2D();
    const steps=160;
    for(let i=0;i<=steps;i++){ const [px,py]=P(i/steps*Math.PI*2,1.0); i?outline.lineTo(px,py):outline.moveTo(px,py); }
    const body = ctx.createRadialGradient(x,y,0,x,y,Rmax);
    body.addColorStop(0, rgba(mint,0.0));
    body.addColorStop(0.45, rgba(mint,0.03));
    body.addColorStop(0.85, rgba(mint,0.05));
    body.addColorStop(1, rgba(mint,0.09));
    ctx.fillStyle = body; ctx.fill(outline);

    // 2) 가는 방사선 — 아주 옅게, 속 코랄 → 겉 민트
    const g = ctx.createRadialGradient(x,y,0,x,y,Rmax);
    g.addColorStop(0, rgba(coral,0.12));
    g.addColorStop(coreStop, rgba(coral,0.05));
    g.addColorStop(Math.min(0.95,coreStop+0.25), rgba(mint,0.028));
    g.addColorStop(1, rgba(mint,0.0));
    ctx.strokeStyle = g; ctx.lineWidth = 0.5;
    ctx.beginPath();
    for(let i=0;i<this.rays.length;i+=RAYSTEP){
      const r=this.rays[i], th=r.a+this.rot, L=this.radius(r.a,p)*r.l, bend=(sway+r.b*0.06)*(L/R)*(L/R);
      ctx.moveTo(x,y);
      ctx.quadraticCurveTo(x+Math.cos(th+bend*0.3)*L*0.55, y+Math.sin(th+bend*0.3)*L*0.55, x+Math.cos(th+bend)*L, y+Math.sin(th+bend)*L);
    }
    ctx.stroke();

    // 3) 팔마다 지나가는 방사관(canal)
    ctx.strokeStyle = rgba(mint,0.14); ctx.lineWidth=0.9;
    ctx.beginPath();
    for(let k=0;k<this.arms;k++){
      const a=k/this.arms*Math.PI*2, [ax,ay]=P(a,0.22), [mx,my]=P(a,0.55), [bx,by]=P(a,0.88);
      ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,bx,by);
    }
    ctx.stroke();

    // 4) 미세 반점 (사진 속 점박이 질감)
    ctx.fillStyle = rgba([210,255,245],0.22);
    for(const s of this.specks){ const [sx,sy]=P(s.a,s.f); ctx.fillRect(sx,sy,0.9,0.9); }

    // 5) 가장자리: 넓은 글로우 + 가는 하이라이트 + 안쪽 두께선 → 젤리 막의 굴절감
    ctx.lineJoin='round';
    ctx.strokeStyle = rgba(mint,0.035); ctx.lineWidth = R*0.10; ctx.stroke(outline);
    ctx.strokeStyle = rgba(mint,0.07);  ctx.lineWidth = R*0.035; ctx.stroke(outline);
    ctx.strokeStyle = rgba([220,255,248],0.2); ctx.lineWidth = 0.7; ctx.stroke(outline);
    ctx.beginPath();
    for(let i=0;i<=steps;i++){ const [px,py]=P(i/steps*Math.PI*2,0.9); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.strokeStyle = rgba(mint,0.06); ctx.lineWidth=0.6; ctx.stroke();

    // 6) 안쪽 우산(벨) 원반
    const bellR = R*(0.34-p*0.05);
    const bell = ctx.createRadialGradient(x,y,bellR*0.2,x,y,bellR);
    bell.addColorStop(0, rgba(mint,0.0)); bell.addColorStop(0.8, rgba(mint,0.03)); bell.addColorStop(1, rgba(mint,0.0));
    ctx.fillStyle=bell; ctx.beginPath(); ctx.arc(x,y,bellR,0,7); ctx.fill();
    ctx.strokeStyle=rgba(mint,0.08); ctx.lineWidth=0.6; ctx.stroke();

    // 7) 촉수 끝 감각점
    ctx.fillStyle = rgba([235,255,250],0.5);
    for(let k=0;k<this.arms;k++){ const [tx,ty]=P(k/this.arms*Math.PI*2, 0.9-this.tips[k]); ctx.beginPath(); ctx.arc(tx,ty,1.0,0,7); ctx.fill(); }

    // 8) 코랄 속 — 부드러운 발광 + 반투명 꽃잎 생식소
    const cr=R*(0.28+this.heat*0.12);
    const cg=ctx.createRadialGradient(x,y,0,x,y,cr);
    cg.addColorStop(0, rgba(coral,0.22)); cg.addColorStop(1, rgba(coral,0));
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(x,y,cr,0,7); ctx.fill();
    const petals=4, pr=R*0.11*(1+p*0.1);
    for(let k=0;k<petals;k++){
      const a=this.rot*1.5+k/petals*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*pr*0.8,y+Math.sin(a)*pr*0.8,pr*0.75,pr*0.42,a,0,7);
      ctx.fillStyle=rgba(coral,0.13); ctx.fill();
      ctx.strokeStyle=rgba(mix(coral,[255,230,215],0.5),0.28); ctx.lineWidth=0.6; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
Jelly.prototype.heat=0;

let jellies=[], ripples=[];
function seed(){
  jellies=[];
  const n = Math.round(Math.min(18, Math.max(8, W*H/70000)));
  for(let i=0;i<n;i++) jellies.push(new Jelly(rnd()*W, rnd()*H));
}
seed();

// ---------- interaction ----------
let down=false, last=null, paused=false, trails=true;
cv.addEventListener('pointerdown',e=>{down=true; last={x:e.clientX,y:e.clientY,moved:false};});
cv.addEventListener('pointermove',e=>{
  if(!down) return;
  stir={x:e.clientX,y:e.clientY,vx:e.clientX-last.x,vy:e.clientY-last.y};
  if(Math.abs(stir.vx)+Math.abs(stir.vy)>2) last.moved=true;
  last.x=e.clientX; last.y=e.clientY;
});
addEventListener('pointerup',e=>{
  if(down && last && !last.moved){ jellies.push(new Jelly(e.clientX,e.clientY)); if(jellies.length>40) jellies.shift(); }
  down=false; stir=null;
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused; e.preventDefault();}
  if(e.key==='t'||e.key==='T') trails=!trails;
});

// ---------- loop ----------
let RAYSTEP=2, avgMs=16.7, t=0, prev=performance.now(), trailFade=0.55, trailTimer=120;
function frame(now){
  const ms = now-prev; const dt = Math.max(0,Math.min(3,ms/16.67)); prev=now;
  // 느려지면 선 밀도를 자동으로 낮춤 (성능 ↔ 디테일)
  if(ms>0 && ms<200){ avgMs += (ms-avgMs)*0.05;
    if(avgMs>24 && RAYSTEP<5){ RAYSTEP++; avgMs=18; }
    else if(avgMs<15 && RAYSTEP>2){ RAYSTEP--; avgMs=18; } }
  if(!paused){
    t += dt*0.016;
    ctx.globalCompositeOperation='source-over';
    // 화면 전체 잔상 길이도 랜덤하게 깜빡임
    if((trailTimer-=dt)<=0){ trailFade = rnd()<0.12 ? 0.25+rnd()*0.08 : 0.5+rnd()*0.1; trailTimer = trailFade<0.3 ? 15+rnd()*25 : 200+rnd()*300; }
    const fade = 1-Math.pow(1-trailFade, dt);   // 프레임 수와 무관하게 초당 같은 속도로 사라짐
    ctx.fillStyle = trails ? `rgba(3,7,10,${fade.toFixed(3)})` : '#03070a';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(const j of jellies) j.update(t,dt);
    for(const j of jellies) j.drawEchoes();
    for(const j of jellies) j.draw(t);
    for(const r of ripples){
      r.r += (r.max - r.r)*0.06*dt; r.life -= 0.018*dt;
      ctx.strokeStyle = `rgba(150,255,225,${Math.max(0,r.life)*0.35})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(r.x,r.y,Math.max(0.1,r.r),0,7); ctx.stroke();
      ctx.strokeStyle = `rgba(255,140,110,${Math.max(0,r.life)*0.25})`; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(r.x,r.y,Math.max(0.1,r.r*0.6),0,7); ctx.stroke();
    }
    ripples = ripples.filter(r=>r.life>0);
    if(stir){ stir.vx*=0.8; stir.vy*=0.8; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
